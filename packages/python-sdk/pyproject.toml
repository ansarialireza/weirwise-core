[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "weirwise"
version = "0.2.0"
description = "Official Python SDK for Weirwise Core - Open-Source RAG Infrastructure"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Weirwise Contributors" }
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
