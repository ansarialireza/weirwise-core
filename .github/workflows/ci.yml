name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: weirwise
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -e packages/python-sdk

      - name: Check code formatting and linting
        run: |
          ruff check .
          ruff format --check .

      - name: Run Alembic database migrations
        env:
          WEIRWISE_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/weirwise
          WEIRWISE_DATABASE_SYNC_URL: postgresql://postgres:postgres@localhost:5432/weirwise
        run: |
          alembic -c server/alembic.ini upgrade head

      - name: Run tests
        env:
          PYTHONPATH: ".:packages/python-sdk"
          WEIRWISE_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/weirwise
          WEIRWISE_DATABASE_SYNC_URL: postgresql://postgres:postgres@localhost:5432/weirwise
        run: |
          pytest server/tests packages/python-sdk/tests

      - name: Verify Core and SDK packaging and distribution build
        run: |
          python -m pip install build
          python -m build packages/python-sdk
          python -m build .
